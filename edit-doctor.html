            <div class="flex gap-3.5 items-center">
              <div class="flex flex-col">
                <p
                  class="font-poppins text-green-lite font-semibold text-[12px]"
                >
                  Marvin McKinney
                </p>
                <p class="text-green-lite font-poppins font-light text-[12px]">
                  Admin
                </p>
              </div>
              <div
                class="w-10 h-10 flex items-center justify-center bg-dark-green-100 text-white text-[20px] rounded-md"
              >
                M
              </div>
            </div>
          </div>
        </div>
        <div class="flex bg-white pl-32 py-7 items-center gap-6">
          <a href="doctors-list.html">
            <i class="fa-solid fa-arrow-left text-grey"></i
          ></a>
          <p class="text-grey text-[14px] font-semibold font-poppins">Doctor</p>
          <div class="w-1.5 h-1.5 rounded-xs bg-grey"></div>
          <p class="text-grey text-[14px] font-semibold font-poppins">
            Edit doctor
          </p>
        </div>
        <div class="bg-grey-lite xl:px-52 lg:px-44 md:px-36 py-12">
          <div
            class="bg-white flex flex-col items-center md:px-20 px-10 py-14 gap-7"
          >
            <p class="text-[20px] font-light">Edit Doctor</p>

            <div class="flex flex-col gap-1.5 items-center">
              <div class="flex justify-between">
                <div class="flex flex-col items-center gap-3">
                  <label class="text-[13px]">Doctor Photo</label>

                  <div
                    id="imageBox"
                    class="relative w-28 h-28 rounded-full border overflow-hidden group"
                  >
                    <img
                      id="doctorPreview"
                      class="hidden w-full h-full object-cover"
                    />

                    <label
                      id="uploadLabelEmpty"
                      for="doctorImage"
                      class="absolute inset-0 flex items-center justify-center text-3xl text-gray-500 bg-gray-100"
                    >
                      +
                    </label>

                    <label
                      id="uploadLabelHover"
                      for="doctorImage"
                      class="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 transition"
                    >
                      <span class="text-white text-3xl">+</span>
                    </label>

                    <input
                      id="doctorImage"
                      type="file"
                      accept="image/*"
                      class="hidden"
                    />
                  </div>
                </div>
                <label class="text-red-600 image hidden">*</label>
              </div>
            </div>
            <div class="grid md:grid-cols-2 gap-x-6 gap-y-4 w-full">
              <div class="flex flex-col gap-1.5">
                <div class="flex justify-between">
                  <label class="text-[13px] font-[400px]">First name</label>
                  <label class="text-red-600 name hidden">*</label>
                </div>
                <input
                  class="border border-grey text-[13px] font-light px-6 py-2.5 doctors-name input"
                  placeholder="Your first name"
                  data-category="input"
                />
              </div>

              <div class="flex flex-col gap-1.5">
                <div class="flex justify-between">
                  <label class="text-[13px] font-[400px]">Last name</label>
                  <label class="text-red-600 Lname hidden">*</label>
                </div>
                <input
                  class="border border-grey text-[13px] font-light px-6 py-2.5 doctors-lastname input"
                  placeholder="Your last name"
                  data-category="input"
                />
              </div>

              <div class="flex flex-col gap-1.5">
                <div class="flex justify-between">
                  <label class="text-[13px] font-[400px]">Email address</label>
                  <label class="text-red-600 email hidden">*</label>
                </div>

                <input
                  class="border border-grey text-[13px] font-light px-6 py-2.5 doctors-email-address input"
                  placeholder="Your email address"
                  type="email"
                  required
                  data-category="input"
                />
              </div>
              <div class="flex flex-col gap-1.5">
                <div class="flex justify-between">
                  <label class="text-[13px] font-[400px]">Phone number</label>
                  <label class="text-red-600 phoneN hidden">*</label>
                </div>
                <input
                  class="border border-grey text-[13px] font-light px-6 py-2.5 doctors-phone-number input"
                  placeholder="Your phone number"
                  type="number"
                  data-category="input"
                />
              </div>
              <div class="flex flex-col gap-1.5">
                <div class="flex justify-between">
                  <label class="text-[13px] font-[400px]">Specialty</label>
                  <label class="text-red-600 specialty hidden">*</label>
                </div>
                <select
                  name="specialization"
                  id="specialization"
                  data-category="input"
                  class="border border-grey input text-[13px] font-light px-6 py-2.5 doctors-specialty"
                >
                  <option disabled selected value class="font-[400px]">
                    Your specialization
                  </option>
                  <option>Dermatologists</option>
                  <option>Infectious disease</option>
                  <option>Ophthalmologists</option>
                  <otpin> Cardiologists</otpin>
                </select>
              </div>

              <div class="flex flex-col gap-1.5">
                <div class="flex justify-between">
                  <label class="text-[13px] font-[400px]">Status</label>
                  <label class="text-red-600 status hidden">*</label>
                </div>
                <select
                  name="specialization"
                  data-category="input"
                  id="specialization"
                  class="border border-grey input text-[13px] font-light px-6 py-2.5 doctors-status"
                >
                  <option disabled selected value class="font-[400px]">
                    Your status
                  </option>
                  <option class="text-green" data-category="approved">
                    Approved
                  </option>
                  <option class="text-watermelon" data-category="declined">
                    Declined
                  </option>
                </select>
              </div>
              <p
                class="text-red-600 font-semibold hidden fill-out-fields text-[12px]"
              >
                Please fill out this fields!
              </p>
            </div>
            <button
              class="bg-green rounded-sm px-10 py-2 text-white text-[13px] font-semibold edit-doctor-button cursor-pointer"
            >
              Edit
            </button>
          </div>
        </div>
        <script src="edit-doctor.js"></script>
